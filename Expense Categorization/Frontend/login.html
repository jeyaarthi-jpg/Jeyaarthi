<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h2>Expense Categorizer</h2>

        <h3>Login</h3>

        <input type="email"
               id="email"
               placeholder="Email">

        <input type="password"
               id="password"
               placeholder="Password">

        <button onclick="login()">
            Login
        </button>

        <p>
            New User?
            <a href="register.html">
                Register
            </a>
        </p>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>

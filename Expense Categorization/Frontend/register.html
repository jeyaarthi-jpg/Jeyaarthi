<!DOCTYPE html>
<html>

<head>
    <title>Register</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h2>AI Expense Categorizer</h2>

        <h3>Create Account</h3>

        <input
            id="username"
            placeholder="Username">

        <input
            id="email"
            placeholder="Email">

        <input
            id="password"
            type="password"
            placeholder="Password">

        <button onclick="register()">
            Register
        </button>

        <p>
            Already have account?
            <a href="login.html">
                Login
            </a>
        </p>

    </div>

</div>

<script src="js/register.js"></script>

</body>
</html>
